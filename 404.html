<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · AIM</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/img/aim-logo-32.png" sizes="32x32" type="image/png">
  <style>
    :root { --bg: #E6EEF8; --card: #EEF3FA; --text: #0F1B3D; --muted: #4A5878; --accent: #163387; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { max-width: 520px; width: 100%; background: var(--card); border-radius: 28px; padding: 40px 32px; text-align: center;
      box-shadow: 10px 10px 24px rgba(20, 40, 110, 0.12), -10px -10px 24px rgba(255, 255, 255, 0.9); }
    .code { font: 700 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; color: #7952EC; }
    h1 { font-size: 30px; line-height: 1.2; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a { color: #fff; background: var(--accent); text-decoration: none; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px; }
    a.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="code">404 · NOT FOUND</div>
    <h1>This page doesn't exist.</h1>
    <p>It may have moved when the site was rebuilt. Everything AIM does is one click away.</p>
    <nav>
      <a href="/">Home</a>
      <a class="ghost" href="/services">Services</a>
      <a class="ghost" href="/work">Work</a>
      <a class="ghost" href="/contact">Contact</a>
    </nav>
  </main>
</body>
</html>
